version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: syntra_postgres
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: syntra_password
      POSTGRES_DB: syntra_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
